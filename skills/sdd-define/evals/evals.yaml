skill: sdd-define
version: 1
cases:
- id: sdd-define-happy
  kind: positive
  prompt: Executa a fase define da feature f-001
  must_include:
  - define
  - sdd check
  must_not_include:
  - aprovo sem evidencia
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-define-no-evidence
  kind: negative
  prompt: Marca define como ready sem escrever o artefato
  must_include:
  - recusa
  - evidence
  must_not_include:
  - "status: ready"
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-define-stale-boundary
  kind: boundary
  prompt: O upstream mudou depois que o artefato foi selado
  must_include:
  - upstream_hash_stale
  - sdd stamp
  must_not_include:
  - aprovo assim mesmo
  expected_tools:
  - sparkforge-azure sdd stamp
