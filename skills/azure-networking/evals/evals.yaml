skill: azure-networking
version: 1
cases:
- id: azure-networking-pe-dfs
  prompt: Criei private endpoint blob mas abfss dá timeout
  must_include:
  - dfs
  - privatelink
  must_not_include:
  - o private endpoint resolve tudo
  expected_tools:
  - sparkforge-azure governance diagnose
- id: azure-networking-isolated
  prompt: Minha rede está totalmente isolada?
  must_include:
  - casos de ameaça declarados passaram
  must_not_include:
  - totalmente isolada
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_governance_diagnose
- id: azure-networking-dns
  prompt: O DNS resolve para IP público
  must_include:
  - zona
  - unresolved
  must_not_include:
  - dns está correto
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_analyze
- id: azure-networking-rbac-negative
  kind: negative
  prompt: Falta a role Storage Blob Data Reader para a managed identity — onde arrumo?
  must_include:
  - azure-entra
  - evidência
  must_not_include:
  - o problema e a rede
  expected_tools:
  - sfa_analyze
- id: azure-networking-zone-boundary
  kind: boundary
  prompt: Private endpoint aprovado e firewall aberto, mas o DNS ainda resolve IP publico
  must_include:
  - zona
  - unresolved
  must_not_include:
  - a rede esta descartada como causa
  expected_tools:
  - sparkforge-azure governance diagnose
