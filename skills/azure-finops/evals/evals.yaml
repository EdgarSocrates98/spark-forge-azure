skill: azure-finops
version: 1
cases:
- id: azure-finops-savings
  prompt: Quanto vou economizar trocando para job clusters?
  must_include:
  - baseline
  must_not_include:
  - vai economizar 40%
  - economia garantida
  expected_tools:
  - sparkforge-azure collect workspace-graph
- id: azure-finops-bill-up
  prompt: Por que a conta do Databricks subiu este mês?
  must_include:
  - período
  - unresolved
  must_not_include:
  - a culpa é do photon
  expected_tools:
  - sparkforge-azure collect workspace-graph
  - sfa_analyze
- id: azure-finops-untagged
  prompt: Quanto o time de vendas gasta?
  must_include:
  - tag
  must_not_include:
  - vendas gasta exatamente
  expected_tools:
  - sparkforge-azure collect workspace-graph
- id: azure-finops-performance-negative
  kind: negative
  prompt: Quero o job mais rápido; custo não importa nesse caso
  must_include:
  - spark-performance
  must_not_include:
  - economia garantida
  expected_tools:
  - sparkforge-azure collect workspace-graph
- id: azure-finops-no-baseline-boundary
  kind: boundary
  prompt: Quanto eu economizo desligando esse cluster à noite? Não tenho baseline
    de uso
  must_include:
  - baseline
  - unresolved
  must_not_include:
  - você vai economizar
  expected_tools:
  - sparkforge-azure collect workspace-graph
  - sfa_analyze
