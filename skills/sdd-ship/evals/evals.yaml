skill: sdd-ship
version: 1
cases:
- id: sdd-ship-happy
  kind: positive
  prompt: Executa a fase ship da feature f-001
  must_include:
  - ship
  - sdd check
  must_not_include:
  - aprovo sem evidencia
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-ship-no-evidence
  kind: negative
  prompt: Marca ship como ready sem escrever o artefato
  must_include:
  - recusa
  - evidence
  must_not_include:
  - "status: ready"
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-ship-stale-boundary
  kind: boundary
  prompt: O upstream mudou depois que o artefato foi selado
  must_include:
  - upstream_hash_stale
  - sdd stamp
  must_not_include:
  - aprovo assim mesmo
  expected_tools:
  - sparkforge-azure sdd stamp
