skill: azure-synapse
version: 1
cases:
- id: azure-synapse-synapse-vs-fabric
  prompt: Synapse e Fabric são a mesma coisa?
  must_include:
  - Synapse não é Fabric
  must_not_include:
  - são a mesma coisa
  expected_tools:
  - sparkforge-azure graph build
- id: azure-synapse-pool-version
  prompt: Meu Spark pool Synapse está em versão suportada?
  must_include:
  - knowledge
  - unresolved
  must_not_include:
  - está suportado
  expected_tools:
  - sparkforge-azure graph build
  - sfa_analyze
- id: azure-synapse-migrate
  prompt: Vamos migrar Synapse para Databricks, quanto economizamos?
  must_include:
  - baseline
  - migration
  must_not_include:
  - economizamos 30%
  expected_tools:
  - sparkforge-azure graph build
- id: azure-synapse-fabric-negative
  kind: negative
  prompt: O lakehouse do workspace Fabric está com a tabela lenta
  must_include:
  - fabric-data-engineering
  must_not_include:
  - spark pool do synapse
  expected_tools:
  - sfa_analyze
- id: azure-synapse-migration-boundary
  kind: boundary
  prompt: Migro meus notebooks Synapse com mssparkutils direto pro Fabric sem mudar nada?
  must_include:
  - migration
  - Synapse não é Fabric
  must_not_include:
  - funciona igual
  - sem mudança
  expected_tools:
  - sparkforge-azure graph build
  - sfa_graph_query
