skill: sdd-explore
version: 1
cases:
- id: sdd-explore-happy
  kind: positive
  prompt: Executa a fase explore da feature f-001
  must_include:
  - explore
  - sdd check
  must_not_include:
  - aprovo sem evidencia
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-explore-no-evidence
  kind: negative
  prompt: Marca explore como ready sem escrever o artefato
  must_include:
  - recusa
  - evidence
  must_not_include:
  - "status: ready"
  expected_tools:
  - sparkforge-azure sdd check
- id: sdd-explore-stale-boundary
  kind: boundary
  prompt: O upstream mudou depois que o artefato foi selado
  must_include:
  - upstream_hash_stale
  - sdd stamp
  must_not_include:
  - aprovo assim mesmo
  expected_tools:
  - sparkforge-azure sdd stamp
