skill: spark-streaming
version: 1
cases:
- id: spark-streaming-exactly-once
  prompt: Meu stream é exactly-once?
  must_include:
  - checkpoint exclusivo
  - sink idempotente
  must_not_include:
  - exactly-once garantido
  expected_tools:
  - sparkforge-azure analyze streaming
- id: spark-streaming-dup-restart
  prompt: Após restart apareceram duplicatas
  must_include:
  - foreachBatch
  - lab verify
  must_not_include:
  - sem perda de dados garantida
  expected_tools:
  - sparkforge-azure analyze streaming
  - sparkforge-azure lab verify
- id: spark-streaming-shared-ckpt
  prompt: Duas queries usam o mesmo checkpoint
  must_include:
  - checkpoint
  - unresolved
  must_not_include:
  - não há problema
  expected_tools:
  - sparkforge-azure analyze streaming
  - sfa_analyze
