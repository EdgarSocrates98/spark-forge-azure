skill: fabric-onelake
version: 1
cases:
- id: fabric-onelake-shortcut-403
  prompt: Shortcut para ADLS retorna 403
  must_include:
  - connection
  - azure-adls
  must_not_include:
  - o shortcut está correto
  expected_tools:
  - sparkforge-azure governance diagnose
- id: fabric-onelake-onelake-uc
  prompt: Role OneLake é o mesmo que grant do Unity Catalog?
  must_include:
  - unity-catalog
  must_not_include:
  - é o mesmo que grant do unity catalog
  expected_tools:
  - sparkforge-azure analyze onelake-shortcuts
- id: fabric-onelake-table-no-files
  prompt: Vejo a tabela mas não os arquivos no OneLake
  must_include:
  - unresolved
  - workspace
  must_not_include:
  - acesso garantido
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_governance_diagnose
- id: fabric-onelake-adls-direct-negative
  kind: negative
  prompt: ACL POSIX direta no container ADLS sem shortcut envolvido
  must_include:
  - azure-adls
  must_not_include:
  - onelake security
  - workspace do fabric
  expected_tools:
  - sparkforge-azure governance diagnose
- id: fabric-onelake-uc-table-boundary
  kind: boundary
  prompt: Acesso negado numa tabela UC que aponta para ADLS via storage credential
  must_include:
  - unity-catalog
  - azure-adls
  must_not_include:
  - é um problema de onelake security
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_governance_diagnose
