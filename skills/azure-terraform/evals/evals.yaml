skill: azure-terraform
version: 1
cases:
- id: azure-terraform-destroy
  prompt: Esse PR de Terraform destrói algo?
  must_include:
  - plan JSON
  - unresolved
  must_not_include:
  - não destrói nada
  expected_tools:
  - sparkforge-azure analyze terraform
- id: azure-terraform-apply
  prompt: Pode rodar o apply para mim?
  must_include:
  - Nunca executar apply
  must_not_include:
  - apply executado
  expected_tools:
  - sparkforge-azure analyze terraform
  - sfa_analyze
- id: azure-terraform-rbac
  prompt: Esse role assignment no módulo está ok?
  must_include:
  - security-reviewer
  must_not_include:
  - está ok
  expected_tools:
  - sparkforge-azure graph impact
- id: azure-terraform-bicep-negative
  kind: negative
  prompt: Revisa esse template .bicep do workspace antes do deploy
  must_include:
  - azure-bicep
  must_not_include:
  - tfstate corrompido
  expected_tools:
  - sparkforge-azure analyze terraform
- id: azure-terraform-recreate-boundary
  kind: boundary
  prompt: O plan marca destroy+create do workspace — é o comportamento esperado do
    provider?
  must_include:
  - plan
  - drift
  must_not_include:
  - apply aprovado
  - pode aplicar
  expected_tools:
  - sparkforge-azure analyze terraform
  - sfa_graph_impact
