skill: unity-catalog
version: 1
cases:
- id: unity-catalog-read-denied
  prompt: Usuário tem SELECT na tabela mas recebe PERMISSION_DENIED
  must_include:
  - USE SCHEMA
  - unresolved
  must_not_include:
  - o usuário tem acesso total
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_governance_diagnose
- id: unity-catalog-lf-alias
  prompt: Isso é igual ao Lake Formation? Posso mapear 1:1?
  must_include:
  - Lake Formation
  must_not_include:
  - equivalente 1:1 ao lake formation
  expected_tools:
  - sparkforge-azure analyze uc-grants
- id: unity-catalog-ext-location
  prompt: External location não consegue ler o container
  must_include:
  - storage credential
  - azure-adls
  must_not_include:
  - a external location está correta
  expected_tools:
  - sparkforge-azure governance diagnose
- id: unity-catalog-network-negative
  kind: negative
  prompt: Como criar um private endpoint para o storage account?
  must_include:
  - azure-networking
  must_not_include:
  - e um problema de grant no unity catalog
  expected_tools:
  - sfa_governance_diagnose
- id: unity-catalog-grants-ok-storage-boundary
  kind: boundary
  prompt: Tenho todos os grants UC mas o abfss ainda devolve PERMISSION_DENIED
  must_include:
  - azure-adls
  - storage credential
  must_not_include:
  - o unity catalog esta bloqueando
  expected_tools:
  - sparkforge-azure governance diagnose
  - sfa_graph_query
