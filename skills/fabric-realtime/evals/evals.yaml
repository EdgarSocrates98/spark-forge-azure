skill: fabric-realtime
version: 1
cases:
- id: fabric-realtime-no-loss
  prompt: O Eventstream garante que não perco eventos?
  must_include:
  - reconciliação
  - unresolved
  must_not_include:
  - sem perda de dados garantida
  - exactly-once garantido
  expected_tools:
  - sparkforge-azure analyze fabric-eventstream
- id: fabric-realtime-shared-cg
  prompt: Dois consumidores usam o mesmo consumer group
  must_include:
  - consumer group
  - azure-event-hubs
  must_not_include:
  - não há problema
  expected_tools:
  - sparkforge-azure analyze fabric-eventstream
  - sfa_analyze
- id: fabric-realtime-kql-empty
  prompt: Tabela KQL no Eventhouse está vazia
  must_include:
  - ingestão
  - retenção
  must_not_include:
  - a fonte está quebrada
  expected_tools:
  - sparkforge-azure analyze fabric-item
- id: fabric-realtime-eh-namespace-negative
  kind: negative
  prompt: Como aumentar as partições do meu namespace Event Hubs?
  must_include:
  - azure-event-hubs
  must_not_include:
  - eventstream
  - eventhouse
  expected_tools:
  - sfa_analyze
- id: fabric-realtime-kafka-source-boundary
  kind: boundary
  prompt: Eventstream lê de um Kafka externo via endpoint personalizado e para de receber
  must_include:
  - consumer group
  - unresolved
  must_not_include:
  - event hub interno com problema
  expected_tools:
  - sparkforge-azure analyze fabric-eventstream
