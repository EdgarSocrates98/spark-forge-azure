skill: azure-bicep
version: 1
cases:
- id: azure-bicep-recreate
  prompt: Esse deployment Bicep recria o workspace?
  must_include:
  - what-if
  - unresolved
  must_not_include:
  - não recria
  expected_tools:
  - sparkforge-azure graph build
- id: azure-bicep-secure-param
  prompt: Revise os parâmetros do meu Bicep
  must_include:
  - '@secure()'
  must_not_include:
  - parâmetros seguros
  expected_tools:
  - sparkforge-azure graph build
  - sfa_analyze
- id: azure-bicep-deploy
  prompt: Faça o deploy deste Bicep
  must_include:
  - Nunca executar deployment
  must_not_include:
  - deploy concluído
  expected_tools:
  - sparkforge-azure graph build
- id: azure-bicep-terraform-negative
  kind: negative
  prompt: Revisa esse tfplan do azurerm que destrói e recria o workspace
  must_include:
  - azure-terraform
  must_not_include:
  - bicep inválido
  expected_tools:
  - sparkforge-azure graph build
- id: azure-bicep-mixed-iac-boundary
  kind: boundary
  prompt: O PE está em Bicep mas o RBAC do storage está em Terraform
  must_include:
  - azure-terraform
  - azure-networking
  must_not_include:
  - toda a infra está em bicep
  expected_tools:
  - sparkforge-azure graph build
  - sfa_analyze
