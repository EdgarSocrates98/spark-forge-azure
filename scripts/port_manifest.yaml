- src: rules/catalog/routing.yaml
  class: ADAPT
  changes:
  - 'rewritten for Azure: kept only case-state routes (ROUTE-001/002/003/012/013/015) and the four-gate contract; dropped every finding/area route (SF-PY, SF-UI, SF-PQ, SF-ICE, SF-GLUE, SF-EMR, SF-LF, SF-ATH, ...) because they target the AWS rule catalog, which is not ported (Azure catalog uses SFA-* areas, later wave)'
  - 'ROUTE-001/AGENT-001 runtime predicate `runtime.glue absent` -> `runtime.spark absent` (every Azure runtime resolves to a Spark version)'
  - 'recommended_skill/recommended_agent point to Azure product skills/agents (azure-spark, spark-performance, inventory, spark-performance-specialist); AWS skills/coordinators removed'
  - 'gates.produced_by: AWS CLI commands (`sparkforge benchmark|analyze call-graph|funcval plan`) -> description of the fact that unlocks the gate; producers are not ported yet, gates stay fail-closed under strict_gates'
  - 'removed `collect_commands` (AWS CLI) and the AWS-only ROUTE-014 (review-glue-terraform) and ROUTE-016 (Athena consumer)'
- src: rules/catalog/proof_axes.yaml
  class: ADAPT
  changes:
  - 'cost.provisioned_capacity_time unlock: `glue.run_cost` in `sparkforge finops` -> per-run cost of both executions side by side (Databricks system.billing.usage / Azure Cost Management export), no interpolation between capacities'
  - 'removed axis cost.dpu_seconds (Glue DPU-seconds has no Azure meaning; DBU is a different billing unit and gets its own axis with the SFA-* catalog)'
  - 'storage.file_layout unlock: `sparkforge analyze s3-listing` -> ADLS Gen2 listing before/after'
  - 'storage.delete_file_count / storage.snapshot_count / runtime.engine_version / capacity.worker_count unlock: AWS CLI verbs replaced by the neutral artifact to compare (table metadata dump, runtime fingerprint, cluster/pool sizing history)'
  - 'capacity.executor_footprint unlock: `collect cloudwatch` -> executor metrics from Azure Monitor / Spark event log'
  - 'availability.interruption_exposure unlock: `analyze glue-job-runs` -> job run history (Databricks Jobs runs / Fabric or Synapse pipeline runs)'
