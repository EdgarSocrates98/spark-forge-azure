name: scheduled

# Tier "scheduled" (section 206): knowledge freshness, deep Lab, optional Azure probes.
# Azure probes run ONLY when the repository explicitly configures OIDC federation
# (vars.AZURE_LIVE == 'true'); they are read-only collectors (section 173).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run python scripts/check_knowledge.py --freshness

  deep-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run sparkforge-azure lab run --all

  azure-probes:
    if: ${{ vars.AZURE_LIVE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,azure]"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: SPARKFORGE_AZURE_LIVE=1 uv run pytest -q -m live_azure
